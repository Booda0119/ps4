<!DOCTYPE html>
<html>
<head>
    <style>
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 9999;
            
            width: 35px;
            height: 35px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            
            /* تم نقل مركز المحاذاة الأساسي هنا */
            transform: translate(-50%, -50%);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            /* الحفاظ على التوسط translate(-50%, -50%) أثناء الدوران rotate */
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
